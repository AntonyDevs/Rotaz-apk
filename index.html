<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rota em andamento</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;padding-top:env(safe-area-inset-top)}
header{background:#2563eb;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0}
.hb{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:#2563eb}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:5}
.tab{flex:1;padding:13px;text-align:center;font-weight:600;color:#6b7280;border:0;background:none;font-size:15px;border-bottom:3px solid transparent}
.tab.on{color:#2563eb;border-color:#2563eb}
main{padding:12px 12px calc(100px + env(safe-area-inset-bottom))}
.item{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.num{min-width:34px;height:34px;padding:0 6px;border-radius:17px;background:#dbeafe;color:#1d4ed8;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.info{flex:1;min-width:0}
.code{font-weight:700;font-size:15px;word-break:break-all}
.desc{white-space:pre-line;font-size:13px;color:#6b7280;margin-top:2px;word-break:break-word}
.acts{display:flex;gap:6px}
.ic{width:38px;height:38px;border-radius:9px;border:1px solid #d1d5db;background:#f9fafb;font-size:16px;cursor:pointer}
.ic:disabled{opacity:.3}
.ok{background:#16a34a;color:#fff;border-color:#16a34a}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item.drag{position:relative;z-index:4;box-shadow:0 10px 24px rgba(0,0,0,.28);transition:none;outline:2px solid #2563eb}
.dh{font-size:12px;color:#6b7280;text-align:center;margin:0 0 10px}
.empty{text-align:center;color:#6b7280;padding:48px 20px;line-height:1.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:#2563eb;color:#fff;border:0;border-radius:30px;padding:16px 28px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,.45);cursor:pointer}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
#scan[hidden]{display:none}
#scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:50%;width:62vmin;height:62vmin;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
#ctl{position:absolute;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:2;display:flex;gap:12px;align-items:center;color:#fff;font-size:13px}
#ctl[hidden]{display:none}
#ctl input{flex:1;accent-color:#fff}
#close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:2}
.hint{position:absolute;left:0;right:0;bottom:calc(40px + env(safe-area-inset-bottom));text-align:center;color:#fff;font-size:14px;z-index:2}
#pick,#add,#cf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:flex;align-items:center;justify-content:center;padding:20px}
#pick[hidden],#add[hidden],#cf[hidden]{display:none}
#add,#cf{z-index:26}
.box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:380px}
.box h2{font-size:17px;margin:0 0 14px}
.box label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:#374151}
.box .big{font-size:18px;font-weight:700;word-break:break-all;color:#2563eb}
.box select,.box input{width:100%;padding:12px;font-size:16px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
.prev{font-size:13px;color:#6b7280;margin:10px 0 18px;word-break:break-word}
.row{display:flex;gap:10px}
.row .btn{flex:1;padding:12px}
.btn.gray{background:#e5e7eb;color:#374151}
.btn.blue{background:#2563eb;color:#fff}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#toast.good{background:#16a34a}
#toast.bad{background:#dc2626}
</style>
</head>
<body>
<header>
  <h1>Rota em andamento</h1>
  <div class="hb"><button class="btn" id="clr">🗑 Limpar</button><button class="btn" id="imp">📎 Planilha</button></div>
</header>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<div class="tabs">
  <button class="tab on" data-t="pend" id="tp">Pendentes</button>
  <button class="tab" data-t="done" id="td">Finalizadas</button>
</div>
<main id="list"></main>
<button class="fab" id="open">📷 Ler QR Code</button>

<div id="scan" hidden>
  <video id="vid" playsinline muted></video>
  <div class="frame"></div>
  <button class="btn" id="close">Fechar</button>
  <div id="ctl" hidden><span>🔍</span><input type="range" id="zoom"><button class="btn" id="torch" hidden>🔦</button></div>
  <div class="hint">Aponte para o QR Code e afaste um pouco o celular até focar</div>
</div>
<div id="add" hidden>
  <div class="box">
    <h2>Código não encontrado</h2>
    <div class="big" id="addcode"></div>
    <p style="font-size:14px;color:#6b7280;margin:8px 0 0">Deseja adicionar como nova tarefa pendente? Ela ficará por último na lista.</p>
    <label for="addr">Endereço</label>
    <input id="addr" type="text" autocomplete="off">
    <label for="bairro">Bairro</label>
    <input id="bairro" type="text" autocomplete="off">
    <div class="row" style="margin-top:18px">
      <button class="btn gray" id="ac">Não</button>
      <button class="btn blue" id="ak">Adicionar</button>
    </div>
  </div>
</div>
<div id="cf" hidden>
  <div class="box">
    <h2>Tarefa encontrada</h2>
    <div class="big" id="cfcode"></div>
    <div class="desc" id="cfdesc" style="margin:8px 0 0"></div>
    <p style="font-size:14px;color:#374151;margin:14px 0 0">Deseja dar baixa e marcar como <b>concluída</b>?</p>
    <div class="row" style="margin-top:18px">
      <button class="btn gray" id="cn">Não</button>
      <button class="btn blue" id="cy">Concluir</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const KEY = 'tarefas-qr-v1';
let tasks = load();
tasks.forEach((t, i) => {
  if (t.n == null || t.n === '') t.n = i + 1;
  if (t.desc) t.desc = t.desc.replace(/Destination Address:/g, 'Endereço:').split('\n').filter(l => !/^AT ID:/i.test(l)).join('\n');
});
let tab = 'pend';
const $ = id => document.getElementById(id);

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let tt;
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 2200);
}

function render(){
  const pend = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);
  $('tp').textContent = 'Pendentes (' + pend.length + ')';
  $('td').textContent = 'Finalizadas (' + done.length + ')';
  $('tp').classList.toggle('on', tab === 'pend');
  $('td').classList.toggle('on', tab === 'done');
  const L = tab === 'pend' ? pend : done;
  if (!L.length){
    $('list').innerHTML = '<div class="empty">' + (tasks.length
      ? (tab === 'pend' ? 'Nenhuma tarefa pendente 🎉' : 'Nenhuma tarefa finalizada ainda.')
      : 'Nenhuma tarefa.<br>Toque em <b>Anexar planilha</b> para importar.<br><small>A planilha precisa ter a coluna SPX TN.</small>') + '</div>';
    return;
  }
  $('list').innerHTML = (tab === 'pend' && L.length > 1 ? '<div class="dh">Segure e arraste uma tarefa para reordenar</div>' : '') +
    L.map(t => '<div class="item" data-i="' + esc(t.id) + '"><div class="num">' + esc(String(t.n)) + '</div><div class="info"><div class="code">' + esc(t.id) +
    '</div>' + (t.desc ? '<div class="desc">' + esc(t.desc) + '</div>' : '') + '</div><div class="acts">' +
    (tab === 'pend'
      ? '<button class="ic ok" data-a="ok" data-i="' + esc(t.id) + '">✓</button>'
      : '<button class="ic" data-a="undo" data-i="' + esc(t.id) + '">↩</button>') +
    '</div></div>').join('');
}

let noClickUntil = 0;
$('list').onclick = e => {
  if (Date.now() < noClickUntil) return;
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.i, a = b.dataset.a;
  if (a === 'ok') setDone(id, true);
  else if (a === 'undo') setDone(id, false);
};

// ---- Segurar e arrastar para reordenar ----
const listEl = $('list');
let hold = null;
function holdBegin(target, x, y){
  if (tab !== 'pend' || target.closest('button')) return;
  const el = target.closest('.item'); if (!el) return;
  hold = { el, x, y, startY: y, lastY: y, active: false };
  hold.timer = setTimeout(holdStart, 350);
}
function holdStart(){
  if (!hold) return;
  hold.active = true;
  hold.el.classList.add('drag');
  if (navigator.vibrate) navigator.vibrate(30);
  hold.raf = requestAnimationFrame(autoScroll);
}
function holdMove(x, y){
  if (!hold) return false;
  if (!hold.active){
    if (Math.abs(x - hold.x) > 10 || Math.abs(y - hold.y) > 10){ clearTimeout(hold.timer); hold = null; }
    return false;
  }
  hold.lastY = y; place();
  return true;
}
function shiftTo(fn){
  const el = hold.el, old = el.offsetTop;
  fn();
  hold.startY += el.offsetTop - old;
}
function place(){
  const el = hold.el;
  for (let k = 0; k < 50; k++){
    el.style.transform = 'translateY(' + (hold.lastY - hold.startY) + 'px) scale(1.02)';
    const r = el.getBoundingClientRect(), c = r.top + r.height / 2;
    const prev = el.previousElementSibling, next = el.nextElementSibling;
    if (prev && prev.classList.contains('item')){
      const pr = prev.getBoundingClientRect();
      if (c < pr.top + pr.height / 2){ shiftTo(() => listEl.insertBefore(el, prev)); continue; }
    }
    if (next && next.classList.contains('item')){
      const nr = next.getBoundingClientRect();
      if (c > nr.top + nr.height / 2){ shiftTo(() => listEl.insertBefore(el, next.nextSibling)); continue; }
    }
    break;
  }
  el.style.transform = 'translateY(' + (hold.lastY - hold.startY) + 'px) scale(1.02)';
}
function autoScroll(){
  if (!hold || !hold.active) return;
  const y = hold.lastY, vh = window.innerHeight;
  let d = 0;
  if (y < 140) d = -Math.ceil((140 - y) / 10);
  else if (y > vh - 140) d = Math.ceil((y - (vh - 140)) / 10);
  if (d){
    const b = window.scrollY;
    window.scrollBy(0, d);
    const a = window.scrollY - b;
    if (a){ hold.startY -= a; place(); }
  }
  hold.raf = requestAnimationFrame(autoScroll);
}
function holdEnd(){
  if (!hold) return;
  clearTimeout(hold.timer); cancelAnimationFrame(hold.raf);
  if (hold.active){
    const el = hold.el;
    el.classList.remove('drag'); el.style.transform = '';
    const order = [...listEl.querySelectorAll('.item')].map(n => n.dataset.i);
    noClickUntil = Date.now() + 400;
    applyOrder(order);
  }
  hold = null;
}
function applyOrder(order){
  const idx = [];
  tasks.forEach((t, i) => { if (!t.done) idx.push(i); });
  const byId = new Map(tasks.map(t => [t.id, t]));
  if (order.length === idx.length && order.every(id => byId.has(id))){
    order.forEach((id, k) => { tasks[idx[k]] = byId.get(id); });
  }
  save(); render();
}
listEl.addEventListener('touchstart', e => { if (e.touches.length === 1) holdBegin(e.target, e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
listEl.addEventListener('touchmove', e => { if (e.touches.length && holdMove(e.touches[0].clientX, e.touches[0].clientY)) e.preventDefault(); }, { passive: false });
listEl.addEventListener('touchend', holdEnd);
listEl.addEventListener('touchcancel', holdEnd);
listEl.addEventListener('contextmenu', e => e.preventDefault());
listEl.addEventListener('mousedown', e => { if (e.button === 0) holdBegin(e.target, e.clientX, e.clientY); });
document.addEventListener('mousemove', e => { if (hold) holdMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', holdEnd);

function setDone(id, v){
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.done = v; save(); render();
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });

// ---- Importar planilha ----
$('imp').onclick = () => $('file').click();
$('clr').onclick = () => {
  if (!tasks.length) { toast('Não há tarefas para limpar'); return; }
  if (!confirm('Apagar todas as ' + tasks.length + ' tarefas? Isso não pode ser desfeito.')) return;
  tasks = []; tab = 'pend'; save(); render();
  toast('Tarefas removidas', 'good');
};
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  if (tasks.length && !confirm('Isso vai substituir as tarefas atuais. Continuar?')) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    const hdr = (rows.shift() || []).map(h => String(h ?? '').trim().toLowerCase().replace(/\s+/g, ' '));
    const col = re => hdr.findIndex(h => re.test(h));
    const cSeq = col(/^sequ[eê]nc(e|ia)$/), cTn = col(/^spx tn$/), cAddr = col(/^destination address$/),
          cBai = col(/^bairro$/), cQdn = col(/^qd\s*(e|&|\/|-)?\s*n$/);
    if (cTn < 0) { toast('Coluna SPX TN não encontrada na planilha', 'bad'); return; }
    const val = (r, c) => c < 0 ? '' : String(r[c] ?? '').trim();
    const seen = new Set(), out = [];
    rows.forEach((r, k) => {
      const id = val(r, cTn);
      if (!id || seen.has(id)) return;
      seen.add(id);
      const lines = [];
      const a = val(r, cAddr), b = val(r, cBai), q = val(r, cQdn);
      if (a) lines.push('Endereço: ' + a);
      if (b) lines.push('Bairro: ' + b);
      if (q) lines.push('QD e N: ' + q);
      out.push({ id, n: val(r, cSeq) || String(k + 1), desc: lines.join('\n'), done: false });
    });
    if (!out.length) { toast('Nenhuma tarefa encontrada na planilha', 'bad'); return; }
    tasks = out; tab = 'pend'; save(); render();
    toast(out.length + ' tarefas importadas', 'good');
  } catch(err){ toast('Erro ao ler a planilha', 'bad'); }
};

$('zoom').oninput = () => { try { track.applyConstraints({ advanced: [{ zoom: +$('zoom').value }] }); } catch(e){} };
$('torch').onclick = () => { torchOn = !torchOn; try { track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch(e){} };

// ---- Adicionar tarefa não encontrada ----
function openAdd(code){
  paused = true; addCode = code;
  $('addcode').textContent = code;
  $('addr').value = ''; $('bairro').value = '';
  $('add').hidden = false;
  if (navigator.vibrate) navigator.vibrate(60);
}
function closeAdd(){ $('add').hidden = true; paused = false; }
$('ac').onclick = () => { skip.add(addCode); closeAdd(); };
$('ak').onclick = () => {
  const a = $('addr').value.trim(), b = $('bairro').value.trim();
  const desc = [a && 'Endereço: ' + a, b && 'Bairro: ' + b].filter(Boolean).join('\n');
  const nums = tasks.map(t => parseFloat(t.n)).filter(x => !isNaN(x));
  const n = nums.length ? Math.max(...nums) + 1 : tasks.length + 1;
  tasks.push({ id: addCode, n, desc, done: false });
  save(); render(); closeAdd();
  if (navigator.vibrate) navigator.vibrate(120);
  toast('✓ ' + addCode + ' adicionada como última pendente', 'good');
};

// ---- Leitor de QR Code ----
let stream, track, torchOn = false, running = false, lastCode = '', lastTime = 0, paused = false, addCode = '';
const skip = new Set();
const vid = $('vid'), cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });

$('open').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
  } catch(e){ toast('Não foi possível acessar a câmera', 'bad'); return; }
  vid.srcObject = stream;
  track = stream.getVideoTracks()[0];
  let caps = {};
  try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch(e){}
  try {
    if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
  } catch(e){}
  $('ctl').hidden = true; $('torch').hidden = true; torchOn = false;
  if (caps.zoom){
    const z = $('zoom');
    z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
    z.value = Math.min(caps.zoom.max, Math.max(caps.zoom.min, 2));
    try { await track.applyConstraints({ advanced: [{ zoom: +z.value }] }); } catch(e){}
    $('ctl').hidden = false;
  }
  if (caps.torch){ $('torch').hidden = false; $('ctl').hidden = false; }
  await vid.play();
  skip.clear(); paused = false;
  $('scan').hidden = false; running = true; loop();
};
$('close').onclick = stop;
function stop(){
  running = false; $('scan').hidden = true;
  if (stream) stream.getTracks().forEach(t => t.stop());
  vid.srcObject = null;
}

let bd = null, busy = false;
try { if ('BarcodeDetector' in window) bd = new BarcodeDetector({ formats: ['qr_code'] }); } catch(e){}

function scanJs(sx, sy, sw, sh){
  const k = Math.min(1, 1000 / sw);
  cv.width = Math.round(sw * k); cv.height = Math.round(sh * k);
  cx.drawImage(vid, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  const d = cx.getImageData(0, 0, cv.width, cv.height);
  const r = jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
  return r && r.data ? r.data : '';
}

async function loop(){
  if (!running) return;
  if (vid.videoWidth && !paused && !busy){
    busy = true;
    try {
      const W = vid.videoWidth, H = vid.videoHeight;
      let val = '';
      if (bd){ const r = await bd.detect(vid); if (r.length) val = r[0].rawValue; }
      if (!val) val = scanJs(W * .15, H * .2, W * .7, H * .6); // centro, mais detalhe
      if (!val) val = scanJs(0, 0, W, H);                       // quadro inteiro
      if (val) handle(val.trim());
    } catch(e){}
    busy = false;
  }
  setTimeout(() => requestAnimationFrame(loop), 60);
}

function handle(code){
  const now = Date.now();
  if (code === lastCode && now - lastTime < 2500) return;
  lastCode = code; lastTime = now;
  const t = tasks.find(t => t.id === code) || tasks.find(t => t.id.toLowerCase() === code.toLowerCase());
  if (!t){ if (!skip.has(code)) openAdd(code); return; }
  if (t.done){ toast(t.id + ' já estava concluída'); return; }
  if (skip.has(t.id)) return;
  openConfirm(t);
}

// ---- Confirmar baixa ----
let cfTask = null;
function openConfirm(t){
  paused = true; cfTask = t;
  $('cfcode').textContent = '#' + t.n + ' · ' + t.id;
  $('cfdesc').textContent = t.desc || '';
  $('cf').hidden = false;
  if (navigator.vibrate) navigator.vibrate(60);
}
function closeConfirm(){ $('cf').hidden = true; paused = false; cfTask = null; }
$('cn').onclick = () => { if (cfTask) skip.add(cfTask.id); closeConfirm(); };
$('cy').onclick = () => {
  const t = cfTask; closeConfirm();
  if (!t) return;
  t.done = true; save(); render();
  if (navigator.vibrate) navigator.vibrate(120);
  toast('✓ ' + t.id + ' concluída', 'good');
};

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
