name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Montar a pasta www (com bibliotecas embutidas)
        run: |
          mkdir -p www
          cp index.html icon-192.png icon-512.png www/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js
          cp node_modules/jsqr/dist/jsQR.js www/jsQR.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js#jsQR.js#' www/index.html

      - name: Criar o projeto Android
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew

      - name: Ícone do app
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          src = Image.open('icon-512.png').convert('RGBA')
          for d, sz in sizes.items():
              p = f'android/app/src/main/res/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              im = src.resize((sz, sz), Image.LANCZOS)
              im.save(f'{p}/ic_launcher.png')
              im.save(f'{p}/ic_launcher_round.png')
          PY
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Compilar o APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk rota-em-andamento.apk

      - name: Guardar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: rota-em-andamento-apk
          path: rota-em-andamento.apk

      - name: Publicar o APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Rota em andamento (build ${{ github.run_number }})
          files: rota-em-andamento.apk
